<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生潔牙紀錄表 🍵 (和風版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <!-- 引入思源宋體，呈現日式傳統感 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Noto Serif TC', serif; 
      /* 和紙質感背景 */
      background-color: #f4f1ea;
      background-image: url('https://www.transparenttextures.com/patterns/rice-paper.png');
      min-height: 100vh; 
      color: #3f3f3c;
    }
    
    /* 傳統和風卡片 */
    .wafu-card {
      background: #faf8f5;
      border: 1px solid #dcd8ce;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255,255,255,0.5);
      border-radius: 4px; /* 日式風格較少圓角，偏向俐落 */
    }

    /* 座號按鈕：未刷牙 (木牌/白紙感) */
    .seat-btn { 
      transition: all 0.2s ease-out; 
      position: relative;
    }
    .seat-btn:active { 
      transform: scale(0.92); 
    }
    
    .not-brushed { 
      background: #e9e6df !important; 
      color: #78716c !important; 
      border: 1px solid #d6d3d1; 
      border-radius: 4px;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.05);
    }
    
    /* 座號按鈕：已刷牙 (印鑑 Hanko 風格) */
    .brushed { 
      background: #fffafa !important; 
      color: #b91c1c !important; /* 朱紅色 */
      border: 3px solid #b91c1c; 
      border-radius: 50% !important; /* 變成圓形印章 */
      box-shadow: inset 0 0 0 2px #fff, 0 2px 6px rgba(185, 28, 28, 0.15);
      transform: rotate(-3deg); /* 模擬蓋章微歪的自然感 */
    }
    /* 印章內圈 */
    .brushed::after {
      content: '';
      position: absolute;
      border: 1px solid rgba(185, 28, 28, 0.4);
      border-radius: 50%;
      top: 2px; bottom: 2px; left: 2px; right: 2px;
      pointer-events: none;
    }

    .watermark { position: fixed; bottom: 10px; right: 15px; opacity: 0.6; font-size: 14px; font-weight: 700; pointer-events: none; color: #78716c; letter-spacing: 2px; }
    .loading-overlay { background: rgba(244, 241, 234, 0.85); backdrop-filter: blur(4px); }
    
    /* 標籤頁 Styles (暖簾/障子門 意象) */
    .tab-btn { @apply px-6 py-4 font-bold text-stone-400 transition-all text-sm sm:text-base border-b-4 border-transparent; letter-spacing: 1px; }
    .tab-btn.active { @apply text-emerald-900 border-emerald-800 bg-emerald-50/50; }
    .tab-btn:not(.active):hover { @apply text-stone-600 bg-stone-100; }

    /* 週表格 Styles */
    .weekly-table { border-collapse: collapse; }
    .weekly-table th { @apply bg-stone-100 text-stone-700 p-4 font-bold border-b-2 border-stone-300 text-center whitespace-nowrap; }
    .weekly-table td { @apply p-3 text-center align-middle border-b border-stone-200 bg-white transition-colors h-16; }
    .weekly-table tr:hover td { @apply bg-stone-50; }
    
    /* 週檢視切換按鈕 (印章縮小版) */
    .weekly-cell-btn { 
      @apply w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center mx-auto transition-transform cursor-pointer font-bold text-lg sm:text-xl;
    }
    .weekly-cell-btn:active { transform: scale(0.85); }
    .status-yes { @apply text-red-700 border-2 border-red-700 rounded-full bg-white; transform: rotate(5deg); }
    .status-no { @apply bg-stone-100 text-stone-400 border border-stone-300 rounded-sm hover:bg-stone-200; }
    .status-none { @apply text-stone-300 text-sm bg-transparent border border-dashed border-stone-300 hover:bg-stone-50 rounded-sm; }

    /* 客製化捲軸 */
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #f4f1ea; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
  </style>
</head>
<body class="p-4 md:p-8">

  <script>
    const GAS_WEB_APP_URL = "在此貼上您的_GAS_WEB_APP_URL";
  </script>

  <div class="max-w-6xl mx-auto wafu-card overflow-hidden animate__animated animate__fadeIn">
    
    <!-- 標題區 (千歲綠/抹茶色系) -->
    <div class="bg-emerald-900 border-b-4 border-emerald-800 px-6 pt-8 pb-0 relative">
      <!-- 裝飾性圖紋 -->
      <div class="absolute top-0 right-0 p-4 opacity-10 pointer-events-none text-white text-6xl">❁</div>
      
      <div class="flex flex-col md:flex-row justify-between items-center mb-8">
        <h1 class="text-3xl md:text-4xl font-black text-stone-50 flex items-center mb-4 md:mb-0 tracking-widest drop-shadow-sm relative z-10">
          <span class="mr-4 text-emerald-200 text-3xl">🍵</span> 學生潔牙紀錄
        </h1>
      </div>
      
      <!-- Tabs -->
      <div class="flex overflow-x-auto pt-2 bg-white/95 rounded-t-lg mx-2 border-x border-t border-stone-200">
        <button id="tab-today" onclick="switchTab('today')" class="tab-btn active shrink-0">一・本日紀錄</button>
        <button id="tab-history" onclick="switchTab('history')" class="tab-btn shrink-0">二・歷史紀錄</button>
        <button id="tab-weekly" onclick="switchTab('weekly')" class="tab-btn shrink-0">三・一週總覽</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="bg-white min-h-[500px] flex flex-col">
      
      <!-- 控制台面板 -->
      <div class="p-6 border-b border-stone-200 bg-stone-50/80">
        
        <!-- Today Controls -->
        <div id="controls-today" class="mode-control flex flex-col md:flex-row items-center gap-4">
          <div class="flex items-center gap-3">
            <label class="text-stone-700 font-bold tracking-wider">學生人數：</label>
            <input type="number" id="studentCount" min="1" max="100" value="30" class="w-20 px-3 py-2 border border-stone-300 rounded text-xl font-bold text-stone-800 focus:outline-none focus:border-emerald-700 focus:ring-1 focus:ring-emerald-700 bg-white text-center">
            <button onclick="generateSeats()" class="bg-stone-700 text-white px-5 py-2 rounded hover:bg-stone-800 font-bold transition-colors shadow-sm tracking-widest">重設座號</button>
          </div>
          <div class="text-md text-stone-600 font-bold ml-auto px-4 py-2 bg-white border border-stone-200 rounded tracking-widest shadow-sm">
            今日：<span id="displayDate" class="text-xl font-black text-emerald-800 ml-2"></span>
          </div>
        </div>

        <!-- History Controls -->
        <div id="controls-history" class="mode-control hidden flex flex-col md:flex-row items-center gap-4 w-full">
          <div class="flex items-center gap-3 w-full">
            <label class="text-stone-700 font-bold tracking-wider">查詢日期：</label>
            <input type="date" id="queryDate" class="px-4 py-2 border border-stone-300 rounded text-lg font-bold text-stone-700 focus:outline-none focus:border-emerald-700 bg-white shadow-sm">
            <button onclick="queryData()" class="bg-amber-700 text-white px-6 py-2 rounded hover:bg-amber-800 font-bold shadow-sm flex items-center gap-2 transition-colors tracking-widest">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              查詢紀錄
            </button>
          </div>
        </div>

        <!-- Weekly Controls -->
        <div id="controls-weekly" class="mode-control hidden flex flex-col md:flex-row items-center gap-4 w-full justify-between">
          <div class="flex items-center gap-3">
            <label class="text-stone-700 font-bold tracking-wider">起始日期 (週一)：</label>
            <input type="date" id="weeklyStartDate" class="px-4 py-2 border border-stone-300 rounded text-lg font-bold text-stone-700 focus:outline-none focus:border-emerald-700 bg-white shadow-sm">
            <button onclick="queryWeeklyData()" class="bg-emerald-800 text-white px-6 py-2 rounded hover:bg-emerald-900 font-bold shadow-sm flex items-center gap-2 transition-colors tracking-widest">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
              顯示一週
            </button>
          </div>
          <div class="text-sm text-stone-500 mt-2 md:mt-0 flex items-center gap-1">
             <span class="text-red-700 border border-red-700 rounded-full w-5 h-5 inline-flex items-center justify-center text-xs font-bold bg-white">已</span>
             點擊表格內之印記即可修改狀態。
          </div>
        </div>

      </div>

      <!-- Views (背景疊加極淡的和紙紋理) -->
      <div class="relative flex-grow bg-[url('https://www.transparenttextures.com/patterns/rice-paper.png')]">
        
        <!-- Grid View (Today/History) -->
        <div id="seatsGrid" class="p-8 grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-8 gap-x-6 gap-y-8 justify-items-center min-h-[300px]"></div>
        
        <!-- Weekly Table View -->
        <div id="weeklyView" class="hidden p-6 overflow-x-auto min-h-[300px]">
          <table class="w-full weekly-table">
            <thead>
              <tr id="weeklyHeaderRow"></tr>
            </thead>
            <tbody id="weeklyBody"></tbody>
          </table>
          <div id="weeklyEmpty" class="hidden text-center text-stone-400 mt-16">
            <p class="text-xl font-bold tracking-widest">請選擇起始日期並點擊「顯示一週」</p>
          </div>
          
          <!-- Weekly Action Buttons -->
          <div id="weeklyActions" class="hidden mt-10 flex justify-center gap-6">
            <button onclick="switchTab('today')" class="px-6 py-2 border border-stone-300 text-stone-600 rounded hover:bg-stone-100 font-bold flex items-center gap-2 transition-colors tracking-widest">
              返回首頁
            </button>
            <button onclick="saveWeeklyChanges()" class="px-8 py-2 bg-emerald-800 text-white rounded hover:bg-emerald-900 font-bold shadow flex items-center gap-2 transition-colors tracking-widest">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
              儲存本週修改
            </button>
          </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-stone-300 pointer-events-none">
          <svg class="h-16 w-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          <p class="text-xl font-bold tracking-widest">請先選擇查詢日期</p>
        </div>
      </div>

      <!-- Footer (Today/History only) -->
      <div id="footer-actions" class="p-6 border-t border-stone-200 flex justify-between items-center bg-stone-50">
        <button onclick="resetUI()" class="flex items-center gap-2 px-6 py-2 border border-stone-300 text-stone-500 rounded hover:bg-white hover:text-stone-700 transition-colors font-bold tracking-widest">
          重置畫面
        </button>

        <div class="flex gap-4">
          <button id="btn-delete" onclick="deleteData()" class="hidden bg-white text-red-700 border border-red-700 px-6 py-2 rounded font-bold hover:bg-red-50 transition-colors tracking-widest">
            刪除此日紀錄
          </button>
          <button id="btn-submit" onclick="submitRecords()" class="bg-emerald-800 text-white px-8 py-2 rounded font-bold hover:bg-emerald-900 transition-colors shadow flex items-center gap-2 tracking-widest">
            <span id="submit-text">儲存紀錄</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="watermark">文君製作 🍵</div>

  <!-- Loading & Message -->
  <div id="loader" class="hidden fixed inset-0 loading-overlay flex flex-col items-center justify-center z-50">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-stone-200 border-t-emerald-800"></div>
    <p id="loader-text" class="mt-6 text-emerald-900 text-lg font-bold tracking-widest">處理中，請稍候...</p>
  </div>
  <div id="messageBox" class="hidden fixed top-8 left-1/2 -translate-x-1/2 bg-stone-800 text-white shadow-xl px-8 py-4 rounded z-50 animate__animated animate__fadeInDown border-l-4">
    <span id="messageText" class="font-bold text-base tracking-widest flex items-center gap-2"></span>
  </div>

  <script>
    let brushedSeats = new Set();
    let currentMode = 'today'; 
    let currentQueryDate = ''; 
    let weeklyDataCache = {}; 
    let weeklyDates = []; 

    const today = new Date();
    const formattedToday = (today.getMonth() + 1).toString().padStart(2, '0') + '/' + today.getDate().toString().padStart(2, '0');
    document.getElementById('displayDate').innerText = formattedToday;
    
    document.getElementById('queryDate').valueAsDate = new Date();
    const day = today.getDay();
    const diff = today.getDate() - day + (day == 0 ? -6 : 1); 
    const monday = new Date(today.setDate(diff));
    document.getElementById('weeklyStartDate').valueAsDate = monday;

    window.onload = () => { generateSeats(); };

    function switchTab(mode) {
      currentMode = mode;
      
      ['today', 'history', 'weekly'].forEach(m => {
        document.getElementById(`tab-${m}`).className = `tab-btn shrink-0 ${mode === m ? 'active' : ''}`;
        document.getElementById(`controls-${m}`).classList.add('hidden');
      });
      document.getElementById(`controls-${mode}`).classList.remove('hidden');

      const grid = document.getElementById('seatsGrid');
      const weekly = document.getElementById('weeklyView');
      const empty = document.getElementById('emptyState');
      const footer = document.getElementById('footer-actions');
      const btnSubmit = document.getElementById('btn-submit');

      grid.classList.add('hidden');
      weekly.classList.add('hidden');
      empty.classList.add('hidden');
      footer.classList.remove('hidden'); 

      if (mode === 'today') {
        grid.classList.remove('hidden');
        btnSubmit.classList.remove('hidden');
        document.getElementById('btn-delete').classList.add('hidden');
        document.getElementById('submit-text').innerText = "儲存紀錄";
        btnSubmit.className = "bg-emerald-800 text-white px-8 py-2 rounded font-bold hover:bg-emerald-900 transition-colors shadow flex items-center gap-2 tracking-widest";
        resetUI();
      } else if (mode === 'history') {
        grid.classList.remove('hidden');
        empty.classList.remove('hidden');
        btnSubmit.classList.add('hidden');
        document.getElementById('btn-delete').classList.add('hidden');
        document.getElementById('submit-text').innerText = "修改並儲存";
        btnSubmit.className = "bg-amber-700 text-white px-8 py-2 rounded font-bold hover:bg-amber-800 transition-colors shadow flex items-center gap-2 hidden tracking-widest";
        grid.innerHTML = '';
      } else if (mode === 'weekly') {
        weekly.classList.remove('hidden');
        footer.classList.add('hidden'); 
        document.getElementById('weeklyEmpty').classList.remove('hidden');
        document.getElementById('weeklyActions').classList.add('hidden');
        document.getElementById('weeklyBody').innerHTML = '';
        document.getElementById('weeklyHeaderRow').innerHTML = '';
      }
    }

    // --- 週檢視邏輯 ---
    async function queryWeeklyData() {
      const startDate = document.getElementById('weeklyStartDate').value;
      if (!startDate) { showMessage("請選擇起始日期", "border-red-500"); return; }
      if (!validateUrl()) return;

      showLoader("讀取一週紀錄...");
      try {
        const url = `${GAS_WEB_APP_URL.trim()}?action=weekly_query&startDate=${startDate}`;
        const response = await fetch(url);
        const json = await response.json();
        hideLoader();

        if (json.status === 'success') {
           weeklyDates = json.dates;
           weeklyDataCache = json.data;
           renderWeeklyTable();
           document.getElementById('weeklyEmpty').classList.add('hidden');
           document.getElementById('weeklyActions').classList.remove('hidden');
        } else {
           showMessage(json.message, "border-red-500");
        }
      } catch (err) {
        hideLoader();
        showMessage("查詢失敗：" + err, "border-red-500");
      }
    }

    function renderWeeklyTable() {
      const headerRow = document.getElementById('weeklyHeaderRow');
      const body = document.getElementById('weeklyBody');
      headerRow.innerHTML = '<th class="text-lg w-20">座號</th>';
      body.innerHTML = '';

      weeklyDates.forEach(d => {
        const th = document.createElement('th');
        th.innerText = d;
        headerRow.appendChild(th);
      });

      const seats = Object.keys(weeklyDataCache).map(Number).sort((a,b) => a-b);
      
      seats.forEach(seat => {
        const tr = document.createElement('tr');
        
        // 座號
        const tdSeat = document.createElement('td');
        tdSeat.className = "font-black text-xl text-stone-700 bg-stone-50 border-r border-stone-200";
        tdSeat.innerText = seat;
        tr.appendChild(tdSeat);

        // 狀態格
        const weekStatus = weeklyDataCache[seat]; 
        weekStatus.forEach((status, dayIndex) => {
          const td = document.createElement('td');
          
          const btn = document.createElement('div');
          btn.className = "weekly-cell-btn";
          
          if (status === '是') {
             btn.innerText = '已'; // 印章風格字體
             btn.classList.add('status-yes');
             btn.onclick = () => toggleWeeklyCell(seat, dayIndex, '否');
          } else if (status === '否') {
             btn.innerText = "未";
             btn.classList.add('status-no');
             btn.onclick = () => toggleWeeklyCell(seat, dayIndex, '是');
          } else {
             btn.innerText = "－"; // 中文連字號
             btn.classList.add('status-none');
             btn.onclick = () => toggleWeeklyCell(seat, dayIndex, '是');
          }
          
          td.appendChild(btn);
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
    }

    function toggleWeeklyCell(seat, dayIndex, newStatus) {
      weeklyDataCache[seat][dayIndex] = newStatus;
      renderWeeklyTable();
    }

    async function saveWeeklyChanges() {
      if (!validateUrl()) return;
      showLoader("資料儲存中...");

      let dataset = [];
      weeklyDates.forEach((dateStr, index) => {
        let dailyRecords = {};
        let hasData = false;
        for (const seat in weeklyDataCache) {
          const status = weeklyDataCache[seat][index];
          if (status === '是' || status === '否') {
            dailyRecords[seat] = status;
            hasData = true;
          }
        }
        if (hasData) dataset.push({ date: dateStr, records: dailyRecords });
      });

      try {
        const response = await fetch(GAS_WEB_APP_URL.trim(), {
          method: "POST",
          body: JSON.stringify({ action: 'batch_save', dataset: dataset }),
          headers: { "Content-Type": "text/plain" }
        });
        const result = await response.json();
        hideLoader();
        
        if (result.status === 'success') {
          showMessage(result.message, "border-emerald-500");
        } else {
          showMessage("儲存失敗：" + result.message, "border-red-500");
        }
      } catch (err) {
        hideLoader();
        showMessage("連線異常，但請求已送出", "border-amber-500");
      }
    }

    // --- 座號生成 (木製牌/印章版) ---
    function generateSeats(seatData = null) {
      const count = parseInt(document.getElementById('studentCount').value);
      const grid = document.getElementById('seatsGrid');
      grid.innerHTML = '';
      if (!seatData) brushedSeats.clear();

      for (let i = 1; i <= count; i++) {
        const btn = document.createElement('button');
        btn.innerText = i;
        btn.id = `seat-${i}`;
        
        let isBrushed = false;
        if (seatData) isBrushed = (seatData[i] === '是');
        else isBrushed = brushedSeats.has(i);

        const baseClass = 'seat-btn w-16 h-16 text-3xl font-bold flex items-center justify-center';
        btn.className = isBrushed ? `${baseClass} brushed` : `${baseClass} not-brushed`;
        
        if (isBrushed) brushedSeats.add(i);

        btn.onclick = () => {
          if (brushedSeats.has(i)) { 
            brushedSeats.delete(i); 
            btn.className = `${baseClass} not-brushed`;
          } else { 
            brushedSeats.add(i); 
            btn.className = `${baseClass} brushed`;
          }
        };
        grid.appendChild(btn);
      }
    }
    
    function formatDateToMMDD(dateString) {
      const parts = dateString.split('-'); 
      if (parts.length === 3) return `${parts[1]}/${parts[2]}`;
      return dateString;
    }

    async function queryData() {
      const dateInput = document.getElementById('queryDate').value;
      if (!dateInput) { showMessage("請選擇日期", "border-red-500"); return; }
      currentQueryDate = formatDateToMMDD(dateInput);
      if (!validateUrl()) return;

      showLoader("查詢紀錄中...");
      try {
        const url = `${GAS_WEB_APP_URL.trim()}?action=query&date=${currentQueryDate}`;
        const response = await fetch(url);
        const json = await response.json();
        hideLoader();

        if (json.status === 'success') {
          document.getElementById('emptyState').classList.add('hidden');
          const seats = Object.keys(json.data).map(Number);
          const maxSeat = seats.length > 0 ? Math.max(...seats) : 30;
          document.getElementById('studentCount').value = maxSeat;
          generateSeats(json.data);
          document.getElementById('btn-submit').classList.remove('hidden');
          document.getElementById('btn-delete').classList.remove('hidden');
          showMessage(`成功載入 ${currentQueryDate} 紀錄`, "border-emerald-500");
        } else {
          showMessage(json.message || "查無此日紀錄", "border-amber-500");
          document.getElementById('seatsGrid').innerHTML = '';
          document.getElementById('emptyState').classList.remove('hidden');
          document.getElementById('btn-submit').classList.add('hidden');
          document.getElementById('btn-delete').classList.add('hidden');
        }
      } catch (err) {
        hideLoader();
        showMessage("查詢發生異常", "border-red-500");
      }
    }

    async function deleteData() {
      if (!confirm(`確認要刪除 ${currentQueryDate} 之所有紀錄？此操作無法復原。`)) return;
      if (!validateUrl()) return;
      showLoader("紀錄刪除中...");
      try {
        await fetch(GAS_WEB_APP_URL.trim(), {
          method: "POST",
          body: JSON.stringify({ action: 'delete', date: currentQueryDate }),
          headers: { "Content-Type": "text/plain" }
        });
        hideLoader();
        showMessage("紀錄已刪除", "border-red-500");
        resetUI();
      } catch (err) {
        hideLoader();
        showMessage("請求已送出", "border-stone-400");
      }
    }

    async function submitRecords() {
      if (!validateUrl()) return;
      const count = parseInt(document.getElementById('studentCount').value);
      const records = {};
      for (let i = 1; i <= count; i++) { records[i] = brushedSeats.has(i) ? "是" : "否"; }
      const targetDate = (currentMode === 'today') ? formattedToday : currentQueryDate;

      showLoader("資料儲存中...");
      try {
        const response = await fetch(GAS_WEB_APP_URL.trim(), {
          method: "POST",
          body: JSON.stringify({ action: 'save', date: targetDate, records: records }),
          headers: { "Content-Type": "text/plain" }
        });
        const result = await response.json();
        hideLoader();
        showMessage(result.message || "紀錄已儲存。", "border-emerald-500");
      } catch (err) {
        hideLoader();
        showMessage("連線異常，但請求已發送", "border-amber-500");
      }
    }

    function validateUrl() {
      if (!GAS_WEB_APP_URL || !GAS_WEB_APP_URL.includes("script.google.com")) {
        showMessage("請先設定 GAS 網址", "border-red-500");
        return false;
      }
      return true;
    }

    function resetUI() {
      if (currentMode === 'today') {
        generateSeats();
      } else if (currentMode === 'history') {
        document.getElementById('seatsGrid').innerHTML = '';
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
        document.getElementById('btn-delete').classList.add('hidden');
      } 
      showMessage("畫面已重置", "border-stone-500");
    }

    function showLoader(text) { document.getElementById('loader-text').innerText = text; document.getElementById('loader').classList.remove('hidden'); }
    function hideLoader() { document.getElementById('loader').classList.add('hidden'); }
    function showMessage(text, borderColor) {
      const box = document.getElementById('messageBox');
      const txt = document.getElementById('messageText');
      
      // 暗色底色的訊息框
      box.className = `fixed top-8 left-1/2 -translate-x-1/2 bg-stone-800 text-white shadow-xl px-8 py-4 rounded z-50 ${borderColor} border-l-4 animate__animated animate__fadeInDown`;
      txt.className = `font-bold text-base tracking-widest flex items-center gap-2`;
      txt.innerText = text;
      
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 3500);
    }
  </script>
</body>
</html>
